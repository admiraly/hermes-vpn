name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Engine + servers (the non-UI crates) on both platforms. This is the
  # job that finally compiles the Linux-only code paths (tap/linux.rs,
  # Unix-socket IPC) that no Windows dev build ever touches.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Deny warnings in our own crates. Cargo caps lints on registry
      # dependencies, so this only gates the workspace.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Build (excluding the Tauri UI crate)
        run: cargo build --workspace --exclude hermes-ui --locked

      - name: Test (excluding the Tauri UI crate)
        run: cargo test --workspace --exclude hermes-ui --locked

      # Informational: the crate opts into clippy::pedantic, which is
      # intentionally noisy. Surface suggestions without failing the build.
      - name: Clippy (informational)
        continue-on-error: true
        env:
          RUSTFLAGS: ""
        run: cargo clippy --workspace --exclude hermes-ui --all-targets

  # Real adapters, real daemons: two network namespaces stand in for two
  # machines and must ping each other across the virtual LAN in every
  # room mode. Catches what loopback tests can't (TAP setup, ARP, MTU,
  # daemon/CLI lifecycle).
  smoke:
    name: smoke (linux netns, real TAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --exclude hermes-ui --locked
      - name: Smoke test (relayed, p2p, fallback, signaling restart, system service)
        run: |
          sudo modprobe tun || true
          for mode in relayed p2p fallback restart service; do
            sudo scripts/netns-smoke.sh "$mode" || exit 1
          done
      - name: Logs on failure
        if: failure()
        run: sudo sh -c 'for f in /tmp/hermes-smoke/*.log; do echo "== $f"; cat "$f"; done'

  # The Windows data path for real: GitHub's Windows runners are elevated,
  # so the daemon can create a wintun adapter. The headless echo peer
  # joins the room via the relay and Windows pings it — first with the
  # daemon run by hand, then installed as a Windows service.
  windows-smoke:
    name: smoke (windows, real wintun)
    runs-on: windows-latest
    env:
      WINTUN_VERSION: "0.14.1"
      WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          cargo build --locked -p hermes-signaling -p hermes-relay -p hermes-daemon -p hermes-cli
          cargo build --locked -p hermes-core --example echo_peer
      - name: Fetch and verify wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINTUN_SHA256) { throw "wintun.zip checksum mismatch: $hash" }
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun/wintun/bin/amd64/wintun.dll target/debug/
      - name: Smoke test (foreground daemon, then Windows service)
        shell: pwsh
        run: ./scripts/windows-smoke.ps1

  # Builds the Windows installer and installs it for real: the service must
  # be registered and running, the files in place, the firewall rule added,
  # and uninstalling must remove all of it again.
  windows-installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hermes-ui/package-lock.json
      - name: Stage daemon, CLI and wintun.dll
        shell: pwsh
        run: ./packaging/windows/stage.ps1
      - name: Build installer
        working-directory: hermes-ui
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.installer.conf.json
      - name: Install, check, upgrade, uninstall
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*-setup.exe

  # Frontend type-check + bundle. Catches TypeScript and Vite errors and
  # produces the dist/ the Tauri crate embeds.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hermes-ui/package-lock.json
      - name: Install deps
        working-directory: hermes-ui
        run: npm ci
      - name: Build frontend (tsc + vite)
        working-directory: hermes-ui
        run: npm run build

  # Build the full Tauri desktop app on Windows, where the webview is
  # built in (no system GTK/WebKit packages to install). Proves the
  # Rust UI backend integrates with the daemon + core end to end.
  tauri:
    name: tauri (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hermes-ui/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build frontend
        working-directory: hermes-ui
        run: npm ci && npm run build
      - name: Build Tauri app
        run: cargo build -p hermes-ui --locked
