name: Release

# Push a tag like v0.2.0 — or run it manually with a tag name, which then
# creates the tag at the commit the run was started on — to build every
# artifact and publish a GitHub Release. Tags containing a '-' (v0.3.0-alpha.1) are
# marked as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0 (created at the run's commit if it doesn't exist)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # https://www.wintun.net — prebuilt, signed DLL; redistributable unmodified.
  WINTUN_VERSION: "0.14.1"
  WINTUN_SHA256: "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51"

jobs:
  linux:
    name: linux x86_64
    # Oldest supported runner = widest glibc compatibility for the binaries.
    runs-on: ubuntu-22.04
    steps:
      # A tag push checks out the tag; a manual run builds the commit it was
      # started on (and the publish step creates the tag there).
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hermes-ui/package-lock.json
      - name: System packages for the desktop app
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Build servers, daemon and CLI
        run: cargo build --release --locked -p hermes-signaling -p hermes-relay -p hermes-daemon -p hermes-cli

      - name: Package binaries
        run: |
          name=hermes-${TAG}-linux-x86_64
          mkdir -p "$name/packaging"
          cp target/release/hermes-signaling target/release/hermes-relay \
             target/release/hermes-daemon target/release/hermes "$name/"
          cp packaging/linux/install.sh packaging/linux/hermes-daemon.service "$name/"
          cp LICENSE.md README.md TEST-RUN.md "$name/"
          tar czf "$name.tar.gz" "$name"
          mkdir -p dist && mv "$name.tar.gz" dist/

      - name: Build desktop app (deb, AppImage)
        working-directory: hermes-ui
        run: |
          npm ci
          npx tauri build --bundles deb,appimage
      - name: Collect desktop bundles
        run: |
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    name: windows x86_64
    runs-on: windows-latest
    steps:
      # A tag push checks out the tag; a manual run builds the commit it was
      # started on (and the publish step creates the tag there).
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hermes-ui/package-lock.json

      - name: Build servers, daemon and CLI
        run: cargo build --release --locked -p hermes-signaling -p hermes-relay -p hermes-daemon -p hermes-cli

      - name: Fetch and verify wintun.dll
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          $hash = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:WINTUN_SHA256) { throw "wintun.zip checksum mismatch: $hash" }
          Expand-Archive wintun.zip -DestinationPath wintun

      - name: Package binaries
        shell: pwsh
        run: |
          $name = "hermes-$env:TAG-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/hermes-signaling.exe, target/release/hermes-relay.exe, `
                    target/release/hermes-daemon.exe, target/release/hermes.exe $name
          Copy-Item wintun/wintun/bin/amd64/wintun.dll $name
          Copy-Item wintun/wintun/LICENSE.txt "$name/wintun-LICENSE.txt"
          Copy-Item LICENSE.md, README.md, TEST-RUN.md $name
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive $name "dist/$name.zip"

      - name: Build desktop app (MSI, NSIS)
        working-directory: hermes-ui
        run: |
          npm ci
          npx tauri build --bundles msi,nsis
      - name: Collect desktop bundles
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle -Recurse -Include *.msi, *-setup.exe | Copy-Item -Destination dist
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    name: publish release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Hermes ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          body: |
            Hermes is a self-hostable virtual LAN with first-class broadcast and
            multicast support. Free for noncommercial use under the
            [PolyForm Noncommercial License 1.0.0](https://github.com/admiraly/hermes-vpn/blob/master/LICENSE.md);
            commercial use needs a separate license.

            **Getting started:** run the servers (`hermes-signaling`, `hermes-relay`)
            somewhere reachable, install the daemon as a service
            ([Linux](https://github.com/admiraly/hermes-vpn/blob/master/docs/DEPLOYMENT.md#5a-linux-client):
            `sudo ./install.sh` from the tarball;
            [Windows](https://github.com/admiraly/hermes-vpn/blob/master/docs/DEPLOYMENT.md#5b-windows-client):
            `hermes-daemon.exe service install`), then use the desktop app or
            the `hermes` CLI. Verify downloads against `SHA256SUMS`.

            **Status:** verified in CI on real network adapters (Linux TAP and
            Windows wintun) in relayed, peer-to-peer and fallback rooms. Not yet
            verified across real NATs between separate machines; reports are very
            welcome ([TEST-RUN.md](https://github.com/admiraly/hermes-vpn/blob/master/TEST-RUN.md)).
            Open work: [CHECKLIST.md](https://github.com/admiraly/hermes-vpn/blob/master/CHECKLIST.md).
          files: dist/*
