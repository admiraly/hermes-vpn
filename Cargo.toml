[workspace]
resolver = "2"
members = [
    "hermes-core",
    "hermes-daemon",
    "hermes-relay",
    "hermes-signaling",
    "hermes-cli",
]

# hermes-ui/src-tauri is intentionally out of the workspace: the Tauri app
# embeds a bundled JS frontend at compile time, which needs a Node toolchain.
# The React sources remain under hermes-ui/ but are not built here.
exclude = ["hermes-ui/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Hermes Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourname/hermes"
rust-version = "1.85"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Crypto
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "serde"] }
chacha20poly1305 = "0.10"
rand = "0.8"
rand_core = "0.6"
blake3 = "1.5"
hex = "0.4"
base64 = "0.22"

# Networking
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
bytes = "1.7"
socket2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# WireGuard
boringtun = "0.7"

# Netlink (Linux interface configuration, in-process so CAP_NET_ADMIN suffices)
rtnetlink = "0.14"

# NAT traversal
igd-next = "0.14"    # UPnP
stun_codec = "0.3"   # STUN message codec
bytecodec = "0.4"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config / paths
directories = "5.0"

# Errors
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6.1"
parking_lot = "0.12"
once_cell = "1.20"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
